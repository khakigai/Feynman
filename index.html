<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feynman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap">
<style>
  :root {
    --bg: #fafaf7;
    --ink: #151614;
    --mute: #8b8c86;
    --faint: #c9cac3;
    --line: #e6e6e0;
    --accent: #66742a;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121311; --ink: #ecece6; --mute: #85867f; --faint: #4a4b46; --line: #262724; --accent: #b0bf72;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121311; --ink: #ecece6; --mute: #85867f; --faint: #4a4b46; --line: #262724; --accent: #b0bf72;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-weight: 400; font-size: 15px; line-height: 1.6;
    padding-inline: 20px; padding-block: 28px 72px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

  button, select, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .t { color: var(--mute); transition: color .15s; }
  .t:hover, .t[aria-pressed="true"], .t[aria-expanded="true"] { color: var(--ink); }

  /* top */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 13px; }
  .mark { font-weight: 600; letter-spacing: -.01em; }
  .mark span { color: var(--mute); font-weight: 400; }
  .top nav { display: flex; gap: 16px; }

  /* controls line */
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px;
    margin-top: 56px; font-size: 14px;
  }
  select {
    appearance: none; -webkit-appearance: none; background: transparent; border: 0; padding: 0 16px 0 0;
    color: var(--mute); cursor: pointer; max-width: 100%; field-sizing: content;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 5px center, right 1px center; background-size: 4px 4px; background-repeat: no-repeat;
  }
  select:hover { color: var(--ink); }
  .pick {
    margin-left: auto; border: 1px solid var(--ink); padding: 7px 16px; font-size: 13px; font-weight: 600;
    transition: background .15s, color .15s;
  }
  .pick:hover { background: var(--ink); color: var(--bg); }
  select option { color: #151614; background: #fff; }

  /* topic */
  .topic { margin-top: 40px; min-height: 170px; display: flex; flex-direction: column; gap: 10px; }
  .meta:empty { display: none; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--mute); display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .term {
    margin: 0; font-weight: 600; letter-spacing: -.03em; line-height: 1.12;
    font-size: clamp(36px, 10vw, 60px); text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere;
  }
  .en { margin: 0; color: var(--mute); font-weight: 300; font-size: 17px; }
  .topic.rolling .term { color: var(--faint); }
  .topic.empty .term { color: var(--faint); font-weight: 400; font-size: clamp(26px, 7vw, 36px); letter-spacing: -.02em; }
  .topic.rolling .en, .topic.rolling .meta { color: var(--faint); }
  .topic.in .term { animation: land .45s cubic-bezier(.2, .8, .2, 1); }
  .topic.in .en { animation: fade .5s ease-out; }
  @keyframes land { from { transform: translateY(-10px); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .pick:disabled { opacity: .3; cursor: not-allowed; }

  /* timer */
  .timer, .actions { animation: fade .4s ease-out; }
  .timer { margin-top: 48px; display: flex; flex-direction: column; gap: 12px; }
  .clockrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .clock { font-family: var(--mono); font-weight: 300; font-size: clamp(48px, 15vw, 76px); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .clock.over { color: var(--accent); }
  .phase { font-size: 13px; color: var(--mute); text-align: right; }
  .line { height: 1px; background: var(--line); position: relative; }
  .line i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width .25s linear; }

  /* actions */
  .actions { margin-top: 36px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .go {
    background: var(--ink); color: var(--bg); padding: 12px 26px; font-weight: 600; font-size: 14px;
    transition: opacity .15s;
  }
  .go:hover { opacity: .85; }
  .go:disabled { opacity: .25; cursor: not-allowed; }
  .actions .t { font-size: 14px; }


  /* drawers */
  .drawer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
  input[type="text"], input[type="number"] {
    background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 0; width: 100%;
    font-size: 16px; border-radius: 0;
  }
  input[type="text"]:focus, input[type="number"]:focus { outline: none; border-bottom-color: var(--ink); }
  .nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

  /* history */
  .history { margin-top: 64px; display: flex; flex-direction: column; gap: 8px; }
  .history-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--mute); }
  .history ol { list-style: none; margin: 0; padding: 0; }
  .history li {
    display: grid; grid-template-columns: 1fr auto; gap: 0 16px; padding: 12px 0;
    border-top: 1px solid var(--line); font-size: 14px;
  }
  .history li:last-child { border-bottom: 1px solid var(--line); }
  .h-meta { grid-column: 1; font-size: 12px; color: var(--mute); }
  .h-state { grid-row: span 2; align-self: center; font-family: var(--mono); font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .confirm { display: inline-flex; gap: 12px; }

  @media (max-width: 440px) {
    .controls { margin-top: 40px; }
    .pick { margin-left: 0; width: 100%; margin-top: 12px; padding: 11px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .topic.in .term, .topic.in .en { animation: none; }
    .line i { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="mark">feynman</span>
    <nav>
      <button type="button" class="t" id="settings-btn" aria-expanded="false" aria-controls="settings">설정</button>
    </nav>
  </div>

  <section class="drawer" id="settings" hidden>
    <div class="nums">
      <label class="field" for="t-research">리서치 (분)<input type="number" id="t-research" min="1" max="60" step="1"></label>
      <label class="field" for="t-speak">말하기 (분)<input type="number" id="t-speak" min="0.5" max="15" step="0.5"></label>
    </div>
  </section>

  <div class="controls">
    <label for="category" hidden>카테고리</label>
    <select id="category"></select>
    <button type="button" class="pick" id="draw">새 주제 뽑기</button>
  </div>

  <section class="topic empty" id="topic" aria-live="polite">
    <div class="meta" id="chip"></div>
    <h1 class="term" id="term">새 주제를 뽑아보세요</h1>
    <p class="en" id="term-en" hidden></p>
  </section>

  <section class="timer" id="timer" aria-label="타이머" hidden>
    <div class="clockrow">
      <span class="clock" id="clock">10:00</span>
      <span class="phase" id="phase"></span>
    </div>
    <div class="line"><i id="bar"></i></div>
  </section>

  <div class="actions" id="actions" hidden>
    <button type="button" class="go" id="run">리서치 시작</button>
  </div>

  <section class="history" id="history-section">
    <div class="history-head">
      <span id="history-title">기록</span>
      <span id="clear-wrap"><button type="button" class="t" id="clear">비우기</button></span>
    </div>
    <ol id="history"></ol>
  </section>
</div>

      terms: ["어둠의 숲 가설|Dark Forest Hypothesis", "페르미 역설|Fermi Paradox", "드레이크 방정식|Drake Equation", "거대 필터 가설|The Great Filter", "인류 원리|Anthropic Principle", "카르다쇼프 척도|Kardashev Scale", "시뮬레이션 가설|Simulation Hypothesis", "볼츠만 두뇌|Boltzmann Brain", "다중우주|Multiverse", "빅뱅 이론|Big Bang Theory", "우주 급팽창|Cosmic Inflation", "암흑물질|Dark Matter", "암흑에너지|Dark Energy", "사건의 지평선|Event Horizon", "블랙홀 정보 역설|Black Hole Information Paradox", "엔트로피|Entropy", "열역학 제2법칙|Second Law of Thermodynamics", "맥스웰의 악마|Maxwell's Demon", "상대성 이론|Theory of Relativity", "쌍둥이 역설|Twin Paradox", "불확정성 원리|Uncertainty Principle", "슈뢰딩거의 고양이|Schrödinger's Cat", "양자 얽힘|Quantum Entanglement", "이중 슬릿 실험|Double-slit Experiment", "나비 효과|Butterfly Effect", "카오스 이론|Chaos Theory", "창발|Emergence", "자기조직화 임계성|Self-organized Criticality", "멱법칙|Power Law", "자연선택|Natural Selection", "이기적 유전자|The Selfish Gene", "밈|Meme", "붉은 여왕 가설|Red Queen Hypothesis", "단속평형설|Punctuated Equilibrium", "수렴 진화|Convergent Evolution", "공진화|Coevolution", "혈연 선택|Kin Selection", "핸디캡 원리|Handicap Principle", "굴절적응|Exaptation", "후성유전학|Epigenetics", "신경가소성|Neuroplasticity", "항상성|Homeostasis", "핵심종|Keystone Species", "몬티 홀 문제|Monty Hall Problem", "생일 역설|Birthday Paradox", "대수의 법칙|Law of Large Numbers", "중심극한정리|Central Limit Theorem", "벤포드의 법칙|Benford's Law", "무한 원숭이 정리|Infinite Monkey Theorem", "괴델의 불완전성 정리|Gödel's Incompleteness Theorems", "섀넌의 정보 이론|Information Theory", "P 대 NP 문제|P vs NP", "튜링 테스트|Turing Test", "중국어 방 논증|Chinese Room", "죄수의 딜레마|Prisoner's Dilemma", "내시 균형|Nash Equilibrium", "좁은 세상 네트워크|Small-world Network", "무어의 법칙|Moore's Law", "기술적 특이점|Technological Singularity"] }
  ];
  const DEFAULTS = { cat: "all", research: 10, speak: 3 };
  const KEY = "khaki-impromptu-v1";

  const $ = (id) => document.getElementById(id);
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
    save(data) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }
  };
  const saved = store.load();
  const state = {
    settings: { ...DEFAULTS, ...(saved.settings || {}) },
    history: Array.isArray(saved.history) ? saved.history : [],
    bags: saved.bags && typeof saved.bags === "object" ? saved.bags : {},
    seen: saved.seen && typeof saved.seen === "object" ? saved.seen : {},
    topic: null,
    phaseIdx: 0, remaining: 0, total: 0, running: false, overtime: false,
    tick: null, lastTs: 0, wakeLock: null
  };
  const persist = () => store.save({ settings: state.settings, history: state.history.slice(0, 60), seen: state.seen });

  const catSel = $("category");
  catSel.append(new Option("전체 카테고리", "all"));
  CATS.forEach(c => catSel.append(new Option(c.name, c.id)));


  const phases = () => [{ name: "리서치", min: state.settings.research }, { name: "말하기", min: state.settings.speak }];

  // ---------- drawing ----------
  const parse = (s) => { const [ko, en] = s.split("|"); return { ko, en: en || "" }; };


  const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let rolling = false;

  // 슬롯처럼 무작위 용어를 빠르게 넘기다가 점점 느려지며 최종 주제에 멈춘다
  function roll(final, pool) {
    if (reduceMotion()) { setTopic(final); return; }
    rolling = true;
    stopTick();
    renderTimer();
    const el = $("topic");
    el.classList.remove("in", "empty"); el.classList.add("rolling");
    const delays = [35, 35, 40, 40, 45, 50, 55, 65, 75, 90, 110, 135, 165];
    let i = 0, last = null;
    const step = () => {
      if (i >= delays.length) {
        el.classList.remove("rolling");
        rolling = false; $("draw").disabled = false;
        setTopic(final);
        return;
      }
      let r;
      do { r = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 2 && (r === last || r.ko === final.ko));
      last = r;
      $("term").textContent = r.ko;
      $("term-en").textContent = r.en; $("term-en").hidden = !r.en;
      if (state.settings.cat === "all") $("chip").textContent = CATS.find(c => c.id === r.catId).name;
      setTimeout(step, delays[i++]);
    };
    step();
  }

  function draw(animate = true) {
    if (rolling || state.running) return;
    const cat = CATS.find(c => c.id === state.settings.cat);
    // 전체: 모든 용어를 한 덱으로
    const pool = cat ? cat.terms.map(s => ({ ...parse(s), catId: cat.id }))
      : CATS.flatMap(c => c.terms.map(s => ({ ...parse(s), catId: c.id })));
    const final = takeFrom(cat ? cat.id : "all", pool);
    if (animate) roll(final, pool); else setTopic(final);
  }

  // 셔플 백: 카테고리·모드별 덱에서 한 장씩 빼서, 한 바퀴 돌기 전엔 반복되지 않는다
  // 이번 바퀴에 본 주제를 기억하고 안 본 것 중에서 뽑는다. 새로 추가한 용어는 바로 후보가 된다
  function takeFrom(key, pool) {
    const current = state.topic && state.topic.ko;
    const names = pool.map(t => t.ko);
    if (!state.seen[key] && state.bags[key]) {
      // 예전 덱 형식에서 이어받기: 덱에 남지 않은 것 = 이미 본 것
      const left = new Set(state.bags[key]);
      state.seen[key] = names.filter(ko => !left.has(ko));
    }
    const seen = new Set(state.seen[key] || []);
    let left = names.filter(ko => !seen.has(ko));
    if (!left.length) {
      // 한 바퀴 끝: 새로 시작하되 방금 본 주제는 첫 장에서 제외
      state.seen[key] = [];
      left = names.length > 1 ? names.filter(ko => ko !== current) : names;
    }
    const ko = left[Math.floor(Math.random() * left.length)];
    state.seen[key] = [...(state.seen[key] || []).filter(n => names.includes(n)), ko];
    delete state.bags[key];
    persist();
    return pool.find(t => t.ko === ko);
  }

  function showEmpty() {
    const el = $("topic");
    el.classList.remove("in", "rolling"); el.classList.add("empty");
    $("chip").textContent = "";
    $("term").textContent = "새 주제를 뽑아보세요";
    $("term-en").hidden = true;
  }

  function setTopic(t) {
    state.topic = t;
    const cat = CATS.find(c => c.id === t.catId);
    $("chip").textContent = state.settings.cat === "all" ? cat.name : "";
    $("term").textContent = t.ko;
    $("term-en").textContent = t.en;
    $("term-en").hidden = !t.en;
    const el = $("topic");
    el.classList.remove("in", "empty"); void el.offsetWidth; el.classList.add("in");
    resetTimer();
  }

  // ---------- timer ----------
  const fmt = (sec) => {
    const s = Math.max(0, Math.ceil(Math.abs(sec)));
    return `${state.overtime ? "+" : ""}${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };

  function resetTimer() {
    stopTick();
    state.phaseIdx = 0; state.overtime = false;
    state.total = state.remaining = phases()[0].min * 60;
    renderTimer();
  }

  function renderTimer() {
    const ps = phases(), ph = $("phase"), run = $("run"), clock = $("clock");
    clock.classList.toggle("over", state.overtime);
    $("timer").hidden = $("actions").hidden = !state.topic || rolling;
    $("draw").disabled = rolling || state.running;

    const p = ps[state.phaseIdx];
    clock.textContent = fmt(state.remaining);
    $("bar").style.width = state.overtime ? "100%" : `${(1 - state.remaining / state.total) * 100}%`;
    ph.textContent = p.name;

    if (state.phaseIdx === 1 && state.running) run.textContent = "설명 끝";
    else if (state.running) run.textContent = "일시정지";
    else if (state.remaining < state.total || state.overtime) run.textContent = "계속";
    else run.textContent = `${p.name} 시작`;
  }

  function startTick() {
    state.running = true; state.lastTs = performance.now();
    state.tick = setInterval(onTick, 250);
    requestWake(); renderTimer();
  }
  function stopTick() {
    state.running = false;
    if (state.tick) clearInterval(state.tick);
    state.tick = null; releaseWake();
  }
  function onTick() {
    const now = performance.now(), dt = (now - state.lastTs) / 1000;
    state.lastTs = now;
    if (state.overtime) state.remaining += dt;
    else {
      state.remaining -= dt;
      if (state.remaining <= 0) {
        beep();
        if (state.phaseIdx === 0) {
          stopTick(); state.phaseIdx = 1;
          state.total = state.remaining = phases()[1].min * 60;
        } else { state.overtime = true; state.remaining = 0; }
      }
    }
    renderTimer();
  }

  function onRun() {
    if (!state.topic) return;
    if (state.phaseIdx === 1 && state.running) { finish(); return; }
    if (state.running) { stopTick(); renderTimer(); } else startTick();
  }

  function finish() {
    stopTick();
    const spoke = state.overtime ? state.total + state.remaining : state.total - state.remaining;
    state.history.unshift({
      ko: state.topic.ko, en: state.topic.en, catId: state.topic.catId,
      spoke: Math.round(spoke), at: Date.now()
    });
    state.topic = null;
    persist(); renderHistory(); showEmpty(); resetTimer();
  }

  let audio;
  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22].forEach(off => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 660; o.connect(g); g.connect(audio.destination);
        const t0 = audio.currentTime + off;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.start(t0); o.stop(t0 + 0.22);
      });
    } catch {}
  }
  async function requestWake() {
    try { if ("wakeLock" in navigator) state.wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  function releaseWake() {
    try { state.wakeLock && state.wakeLock.release(); } catch {}
    state.wakeLock = null;
  }

  // ---------- history ----------
  function renderHistory() {
    const ol = $("history");
    ol.innerHTML = "";
    state.history.slice(0, 30).forEach(h => {
      const cat = CATS.find(c => c.id === h.catId);
      const d = new Date(h.at);
      const li = document.createElement("li");
      li.innerHTML = `<span class="h-term"></span><span class="h-state"></span><span class="h-meta"></span>`;
      li.querySelector(".h-term").textContent = h.ko;
      li.querySelector(".h-state").textContent = `${Math.floor(h.spoke / 60)}:${String(h.spoke % 60).padStart(2, "0")}`;
      li.querySelector(".h-meta").textContent =
        `${d.getMonth() + 1}.${d.getDate()} · ${cat ? cat.name : ""}`;
      ol.append(li);
    });
    $("history-title").textContent = state.history.length ? `기록 ${state.history.length}` : "기록";
    $("history-section").hidden = state.history.length === 0;
  }

  $("clear-wrap").addEventListener("click", (e) => {
    const wrap = $("clear-wrap"), id = e.target.id;
    if (id === "clear") {
      wrap.innerHTML = `<span class="confirm">모두 지울까요? <button type="button" class="t" id="clear-yes" style="color:var(--ink)">지우기</button><button type="button" class="t" id="clear-no">취소</button></span>`;
    } else if (id === "clear-yes" || id === "clear-no") {
      if (id === "clear-yes") { state.history = []; persist(); }
      wrap.innerHTML = `<button type="button" class="t" id="clear">비우기</button>`;
      renderHistory();
    }
  });

  // ---------- controls ----------

  if (!CATS.some(c => c.id === state.settings.cat)) state.settings.cat = "all";
  catSel.value = state.settings.cat;
  catSel.addEventListener("change", () => { state.settings.cat = catSel.value; persist(); });

  Object.entries({ "t-research": "research", "t-speak": "speak" }).forEach(([id, key]) => {
    const el = $(id); el.value = state.settings[key];
    el.addEventListener("change", () => {
      const v = parseFloat(el.value);
      if (!isFinite(v) || v <= 0) { el.value = state.settings[key]; return; }
      state.settings[key] = Math.min(v, 60); el.value = state.settings[key]; persist();
      if (!state.running && state.phaseIdx !== 2) resetTimer(); else renderTimer();
    });
  });

  function toggle(btn, panel) {
    const open = panel.hidden;
    panel.hidden = !open; btn.setAttribute("aria-expanded", open);
    return open;
  }
  $("settings-btn").addEventListener("click", () => toggle($("settings-btn"), $("settings")));

  $("draw").addEventListener("click", () => draw());
  $("run").addEventListener("click", onRun);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select, textarea, button")) return;
    if (e.key === "Enter") { e.preventDefault(); draw(); }
    else if (e.key === " ") { e.preventDefault(); onRun(); }
  });

  renderHistory();
  resetTimer();
})();
</script>
</body>
